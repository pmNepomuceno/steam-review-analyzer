[loggers]
keys=root,uvicorn,uvicorn.error,uvicorn.access

[handlers]
keys=console

[formatters]
keys=default

[logger_root]
level=INFO
handlers=console

[logger_uvicorn]
level=INFO
handlers=
qualname=uvicorn

[logger_uvicorn.error]
level=INFO
handlers=
qualname=uvicorn.error

[logger_uvicorn.access]
level=INFO
handlers=
qualname=uvicorn.access

[handler_console]
class=StreamHandler
formatter=default
args=(sys.stderr,)

[formatter_default]
format=%(asctime)s %(levelname)-8s %(name)s: %(message)s
